<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio - Contact</title>
    <link rel="stylesheet" href="CSS/styles.css">
</head>
<body>

    <header class="site-header">
        <a class="logo" href="index.html">Studio</a>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="components.html">Components</a></li>
                <li><a class="active" href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section class="hero">
            <h1>Contact Us</h1>
            <p>We would love to hear from you. Get in touch with us using the form below.</p>
        </section>

        <section class="section" style="max-width: 600px; margin: 0 auto;">
            <form class="custom-form">
                <div class="form-group">
                    <label for="contact-name">Your Name</label>
                    <input type="text" id="contact-name" name="name" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label for="contact-email">Email Address</label>
                    <input type="email" id="contact-email" name="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="contact-message">Message</label>
                    <textarea id="contact-message" name="message" rows="5" placeholder="Write your message here..." required style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-family: inherit;"></textarea>
                </div>
                <button type="submit" class="btn">Send Message</button>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">&copy; 2026 Studio Lab. All rights reserved.</div>
    </footer>

</body>
</html>
